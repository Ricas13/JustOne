services:
  dlhd-catalogue:
    build:
      context: ./docker/dlhd-proxy
    restart: unless-stopped
    environment:
      DLHD_BASE_URL: ${DLHD_BASE_URL:-https://daddylivestream.com}
      DLHD_EASYPROXY_BASE_URL: ${DLHD_EASYPROXY_BASE_URL:-https://daddylive.sx}
      SOCKS5: ${SOCKS5:-}
      CHANNEL_REFRESH_SECONDS: ${CHANNEL_REFRESH_SECONDS:-300}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)); sys.exit(0 if data.get('ok') and data.get('mode') == 'catalogue-only' else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  easyproxy:
    build:
      context: ./docker/easyproxy
      args:
        EASYPROXY_REPO: ${EASYPROXY_REPO:-https://github.com/domainus/EasyProxy-English.git}
        EASYPROXY_REF: ${EASYPROXY_REF:-8a326aea8d24331182fe0d6012ac15237e780b30}
    restart: unless-stopped
    environment:
      GLOBAL_PROXY: ${GLOBAL_PROXY:-}
      VAVOO_PROXY: ${VAVOO_PROXY:-}
      DLHD_PROXY: ${DLHD_PROXY:-}
      EASYPROXY_CACHE_FILE: /app/data/.dlhd_cache
    volumes:
      - easyproxy-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:7860/api/info', timeout=3)); sys.exit(0 if data.get('status') else 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  jellyfin-live:
    build:
      context: ./apps/jellyfin-live
    restart: unless-stopped
    depends_on:
      dlhd-catalogue:
        condition: service_healthy
      easyproxy:
        condition: service_started
    environment:
      DLHD_CATALOGUE_URL: http://dlhd-catalogue:3000
      EASYPROXY_URL: http://easyproxy:7860
      EASYPROXY_REQUEST_TIMEOUT_MS: ${EASYPROXY_REQUEST_TIMEOUT_MS:-60000}
      EASYPROXY_BRIDGE_SECRET: ${EASYPROXY_BRIDGE_SECRET:-smoke-test-bridge-secret}
      PUBLIC_URL: ${SMOKE_PUBLIC_URL:-http://127.0.0.1:18090}
      PLAYLIST_KEY: ${SMOKE_PLAYLIST_KEY:-}
      JELLYFIN_LIVE_PORT: 8090
      JELLYFIN_REFRESH_MIN: ${JELLYFIN_REFRESH_MIN:-10}
      JELLYFIN_EPG_CACHE_MIN: ${JELLYFIN_EPG_CACHE_MIN:-60}
      JELLYFIN_EPG_MAX_SOURCES: ${JELLYFIN_EPG_MAX_SOURCES:-12}
      JELLYFIN_AUTO_EPG: ${SMOKE_AUTO_EPG:-false}
      JELLYFIN_EXCLUDE_ADULT: ${JELLYFIN_EXCLUDE_ADULT:-true}
      JELLYFIN_EPG_SOURCE_URLS: ${SMOKE_EPG_SOURCE_URLS:-}
      DLSTREAMS_HOME: ${DLSTREAMS_HOME:-https://dlstreams.st/}
    ports:
      - "127.0.0.1:${SMOKE_PORT:-18090}:8090"

volumes:
  easyproxy-data:
