name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Jellyfin Live
        working-directory: apps/jellyfin-live
        run: |
          npm install
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate DLHD resolver
        working-directory: docker/dlhd-proxy
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile app.py provider.py settings.py utils.py
          python -m unittest discover -s . -p 'test_*.py'
          python -c "import app; print('dlhd resolver import ok')"

      - name: Validate compose
        run: docker compose config

      - name: Build containers
        run: docker compose build
