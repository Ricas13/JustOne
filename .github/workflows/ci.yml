name: JustOne CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Jellyfin Live dependencies
        run: npm install --prefix apps/jellyfin-live --no-audit --no-fund

      - name: Test Jellyfin Live
        run: npm test --prefix apps/jellyfin-live

      - name: Install platform dependencies
        run: npm install --prefix apps/platform --no-audit --no-fund

      - name: Test platform
        run: npm test --prefix apps/platform

      - name: Syntax-check Stremio addon entrypoint
        run: node --check apps/stremio-addon/src/index.js

      - name: Validate Docker Compose config
        run: |
          touch .env
          docker compose config --quiet

      - name: Build DLHD backend image
        run: docker compose build dlhd-proxy

      - name: Import DLHD backend without Reflex frontend init
        run: |
          docker run --rm --entrypoint python \
            -e DLHD_BASE_URL=https://example.invalid \
            justone-amddeus-dlhd-proxy:local -c \
            "from dlhd_proxy.backend import fastapi_app, step_daddy; from dlhd_proxy.step_daddy import _extract_direct_hls_source, _rewrite_direct_hls_playlist; import base64; paths={r.path for r in fastapi_app.routes}; assert '/stream/{channel_id}.m3u8' in paths; assert '/key/{url}/{host}' in paths; assert '/content/{path}' in paths; assert step_daddy._base_url == 'https://example.invalid'; url='https://cdn.example/live/main.m3u8?token=x'; encoded=base64.b64encode(url.encode()).decode(); assert _extract_direct_hls_source('source:window.atob(\"'+encoded+'\")') == url; out=_rewrite_direct_hls_playlist('#EXTM3U\\n#EXT-X-KEY:METHOD=AES-128,URI=\"key.bin\"\\n#EXTINF:6,\\nseg-1.ts\\n', url); assert out.startswith('#EXTM3U'); assert out.count('/content/') == 2; assert 'seg-1.ts' not in out; assert 'key.bin' not in out"
