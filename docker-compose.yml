name: ${COMPOSE_PROJECT_NAME:-justone}

# JustOne is now Live TV only. The platform and Jellyfin organizer are public
# through Traefik; both DLHD backends and the optional Stremio live addon stay
# private on the internal network.
services:
  # Primary DLHD resolver/proxy. Pinned to a known upstream commit so a future
  # upstream change cannot silently alter production playback. It stays private;
  # Jellyfin still talks only to JustOne /play/live/... endpoints.
  dlhd-proxy:
    build:
      context: "https://github.com/amddeus/dlhd-proxy.git#d2c691c52976d85218d22c6addc0fcc6dd9a5593"
      args:
        PORT: "3000"
        API_URL: http://dlhd-proxy:3000
        PROXY_CONTENT: "TRUE"
        SOCKS5: ""
    image: justone-amddeus-dlhd-proxy:local
    container_name: justone-dlhd-proxy
    restart: unless-stopped
    environment:
      PORT: "3000"
      REFLEX_API_URL: http://dlhd-proxy:3000
      PROXY_CONTENT: "TRUE"
      SOCKS5: ""
      TZ: Europe/London
      GUIDE_UPDATE: "03:00"
      DLHD_PROXY_KEY_FILE: /app/data/token.key
    volumes:
      - dlhd_proxy_data:/app/data
    labels:
      - "traefik.enable=false"
    networks:
      - justone

  # Existing DLHD resolver is retained as playback fallback.
  dlhd:
    build:
      context: ./docker/dlhd
    image: justone-dlhd:local
    container_name: justone-dlhd
    restart: unless-stopped
    environment:
      PORT: "3000"
      DLHD_BASE: ${DLHD_BASE:-https://dlhd.st}
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      HOST: "0.0.0.0"
    labels:
      - "traefik.enable=false"
    networks:
      - justone

  platform:
    build:
      context: ./apps/platform
    container_name: justone-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PLATFORM_PORT: "8080"
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      DLHD_PROXY_URL: http://dlhd-proxy:3000
      DLHD_URL: http://dlhd:3000
      DLSTREAMS_247: ${DLSTREAMS_247:-https://dlstreams.st/24-7-channels.php}
      DLSTREAMS_HOME: ${DLSTREAMS_HOME:-https://dlstreams.st/}
      STREMIO_UPSTREAM: http://stremio-addon:7000
      PATH_LIVE: ${PATH_LIVE:-/mnt/resolver-files/Live}
      EPG_URL: ${EPG_URL:-}
      LIVE_REFRESH_MIN: ${LIVE_REFRESH_MIN:-360}
      RESOLVE_TTL_MS: ${RESOLVE_TTL_MS:-3600000}
      LIVE_SOURCE_PROBE_TIMEOUT_MS: ${LIVE_SOURCE_PROBE_TIMEOUT_MS:-7000}
      LIVE_SOURCE_RECHECK_MS: ${LIVE_SOURCE_RECHECK_MS:-15000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PLAYLIST_KEY: ${PLAYLIST_KEY:-}
    volumes:
      - ${RESOLVER_FILES:-/mnt/resolver-files}:/mnt/resolver-files
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - dlhd-proxy
      - dlhd
    networks:
      - justone
      - media_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=media_net"
      - "traefik.http.routers.justone-platform.rule=Host(`resolver.vpn4u.cc`)"
      - "traefik.http.routers.justone-platform.entrypoints=websecure"
      - "traefik.http.routers.justone-platform.tls=true"
      - "traefik.http.routers.justone-platform.tls.certresolver=le"
      - "traefik.http.routers.justone-platform.priority=10000"
      - "traefik.http.routers.justone-platform.service=justone-platform"
      - "traefik.http.services.justone-platform.loadbalancer.server.port=8080"

  jellyfin-live:
    build:
      context: ./apps/jellyfin-live
    container_name: justone-jellyfin-live
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JELLYFIN_LIVE_PORT: "8090"
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      PLATFORM_URL: http://platform:8080
      PLAYLIST_KEY: ${PLAYLIST_KEY:-}
      DLSTREAMS_HOME: ${DLSTREAMS_HOME:-https://dlstreams.st/}
      EPG_URL: ${EPG_URL:-}
      JELLYFIN_EPG_SOURCE_URLS: ${JELLYFIN_EPG_SOURCE_URLS:-}
      JELLYFIN_AUTO_EPG: ${JELLYFIN_AUTO_EPG:-true}
      JELLYFIN_EPG_MAX_SOURCES: ${JELLYFIN_EPG_MAX_SOURCES:-12}
      JELLYFIN_EPG_CACHE_MIN: ${JELLYFIN_EPG_CACHE_MIN:-60}
      JELLYFIN_REFRESH_MIN: ${JELLYFIN_REFRESH_MIN:-10}
      JELLYFIN_EXCLUDE_ADULT: ${JELLYFIN_EXCLUDE_ADULT:-true}
    depends_on:
      - platform
    networks:
      - justone
      - media_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=media_net"
      - "traefik.http.routers.justone-jellyfin.rule=Host(`resolver.vpn4u.cc`) && PathPrefix(`/jellyfin`)"
      - "traefik.http.routers.justone-jellyfin.entrypoints=websecure"
      - "traefik.http.routers.justone-jellyfin.tls=true"
      - "traefik.http.routers.justone-jellyfin.tls.certresolver=le"
      - "traefik.http.routers.justone-jellyfin.priority=11000"
      - "traefik.http.routers.justone-jellyfin.service=justone-jellyfin"
      - "traefik.http.routers.justone-jellyfin.middlewares=justone-jellyfin-compress"
      - "traefik.http.middlewares.justone-jellyfin-compress.compress=true"
      - "traefik.http.services.justone-jellyfin.loadbalancer.server.port=8090"

  # Kept as a Live-TV-only addon so removing VOD does not remove an existing
  # live client surface.
  stremio-addon:
    build:
      context: ./apps/stremio-addon
    container_name: justone-stremio
    restart: unless-stopped
    environment:
      PORT: "7000"
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      PLATFORM_URL: http://platform:8080
      DLHD_URL: http://dlhd:3000
      PLAYLIST_KEY: ${PLAYLIST_KEY:-}
    labels:
      - "traefik.enable=false"
    networks:
      - justone

volumes:
  dlhd_proxy_data:

networks:
  justone:
    name: justone_internal
  media_net:
    name: ${TRAEFIK_NETWORK:-media_net}
    external: true
