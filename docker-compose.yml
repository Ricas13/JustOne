services:
  cinepro:
    image: ghcr.io/cinepro-org/core:latest
    container_name: justone-cinepro
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      STREMIO_ADDON: ${STREMIO_ADDON:-true}
      HOST: "0.0.0.0"
      PORT: "3000"
      PUBLIC_URL: ${CINEPRO_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - justone
    labels:
      - traefik.enable=true
      - traefik.docker.network=justone
      - traefik.http.routers.justone-cinepro.rule=Host(`${TRAEFIK_HOST:-localhost}`) && PathPrefix(`/cinepro`)
      - traefik.http.routers.justone-cinepro.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.justone-cinepro.tls=true
      - traefik.http.routers.justone-cinepro.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.justone-cinepro.priority=20
      - traefik.http.routers.justone-cinepro.middlewares=justone-cinepro-strip
      - traefik.http.middlewares.justone-cinepro-strip.stripprefix.prefixes=/cinepro
      - traefik.http.services.justone-cinepro.loadbalancer.server.port=3000

  dlhd:
    build:
      context: ./docker/dlhd
    image: justone-dlhd:local
    container_name: justone-dlhd
    restart: unless-stopped
    environment:
      PORT: "3000"
      DLHD_BASE: ${DLHD_BASE:-https://dlhd.st}
    ports:
      - "3001:3000"
    networks:
      - justone
    labels:
      - traefik.enable=true
      - traefik.docker.network=justone
      - traefik.http.routers.justone-dlhd.rule=Host(`${TRAEFIK_HOST:-localhost}`) && PathPrefix(`/dlhd`)
      - traefik.http.routers.justone-dlhd.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.justone-dlhd.tls=true
      - traefik.http.routers.justone-dlhd.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.justone-dlhd.priority=20
      - traefik.http.routers.justone-dlhd.middlewares=justone-dlhd-strip
      - traefik.http.middlewares.justone-dlhd-strip.stripprefix.prefixes=/dlhd
      - traefik.http.services.justone-dlhd.loadbalancer.server.port=3000

  platform:
    build:
      context: ./apps/platform
    container_name: justone-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PLATFORM_PORT: "8080"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      CINEPRO_URL: http://cinepro:3000
      CINEPRO_PUBLIC_URL: ${CINEPRO_PUBLIC_URL:-http://localhost:3000}
      DLHD_URL: http://dlhd:3000
      LIBRARY_ROOT: /data/library
      MOVIES_PATH: /data/library/movies
      TV_PATH: /data/library/tv
      LIVE_PATH: /data/library/live
      STRM_USE_PROXY: ${STRM_USE_PROXY:-true}
    volumes:
      - ./data/library:/data/library
    depends_on:
      - cinepro
      - dlhd
    ports:
      - "8080:8080"
    networks:
      - justone
    labels:
      - traefik.enable=true
      - traefik.docker.network=justone
      - traefik.http.routers.justone.rule=Host(`${TRAEFIK_HOST:-localhost}`)
      - traefik.http.routers.justone.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.justone.tls=true
      - traefik.http.routers.justone.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.justone.priority=1
      - traefik.http.services.justone.loadbalancer.server.port=8080

  stremio-addon:
    build:
      context: ./apps/stremio-addon
    container_name: justone-stremio
    restart: unless-stopped
    environment:
      PORT: "7000"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      PLATFORM_URL: ${PUBLIC_URL:-http://localhost:8080}
      CINEPRO_URL: http://cinepro:3000
      DLHD_URL: http://dlhd:3000
      TMDB_API_KEY: ${TMDB_API_KEY}
    depends_on:
      - platform
      - cinepro
      - dlhd
    ports:
      - "7000:7000"
    networks:
      - justone
    labels:
      - traefik.enable=true
      - traefik.docker.network=justone
      - traefik.http.routers.justone-stremio.rule=Host(`${TRAEFIK_HOST:-localhost}`) && PathPrefix(`/stremio-live`)
      - traefik.http.routers.justone-stremio.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.justone-stremio.tls=true
      - traefik.http.routers.justone-stremio.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.justone-stremio.priority=20
      - traefik.http.routers.justone-stremio.middlewares=justone-stremio-strip
      - traefik.http.middlewares.justone-stremio-strip.stripprefix.prefixes=/stremio-live
      - traefik.http.services.justone-stremio.loadbalancer.server.port=7000

networks:
  justone:
    name: justone
