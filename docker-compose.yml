name: ${COMPOSE_PROJECT_NAME:-justone}

# Platform and the Jellyfin Live organizer are on Traefik. Source resolvers, dlhd and stremio stay internal
# so they cannot steal Host(resolver.vpn4u.cc) when exposedByDefault is true.
services:
  cinepro:
    build:
      context: ./providers/cinepro
      dockerfile: Dockerfile
    image: justone-cinepro:local
    container_name: justone-cinepro
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      STREMIO_ADDON: "false"
      HOST: "0.0.0.0"
      PORT: "3000"
      PUBLIC_URL: ${CINEPRO_PUBLIC_URL:-https://resolver.vpn4u.cc/cinepro}
    labels:
      - "traefik.enable=false"
    networks:
      - justone

  webstreamr-mbg:
    build:
      context: .
      dockerfile: docker/webstreamr-mbg/Dockerfile
    image: justone-webstreamr-mbg:local
    container_name: justone-stream-provider
    restart: unless-stopped
    environment:
      PORT: "51546"
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      CACHE_DIR: /cache
    expose:
      - "51546"
    volumes:
      - webstreamr_mbg_cache:/cache
    labels:
      - "traefik.enable=false"
    networks:
      - justone

  dlhd:
    build:
      context: ./docker/dlhd
    image: justone-dlhd:local
    container_name: justone-dlhd
    restart: unless-stopped
    environment:
      PORT: "3000"
      DLHD_BASE: ${DLHD_BASE:-https://dlhd.st}
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      HOST: "0.0.0.0"
    labels:
      - "traefik.enable=false"
    networks:
      - justone

  platform:
    build:
      context: ./apps/platform
    container_name: justone-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PLATFORM_PORT: "8080"
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      CINEPRO_URL: http://cinepro:3000
      CINEPRO_PUBLIC_URL: ${CINEPRO_PUBLIC_URL:-https://resolver.vpn4u.cc/cinepro}
      WEBSTREAMR_MBG_URL: ${WEBSTREAMR_MBG_URL:-http://webstreamr-mbg:51546}
      SOURCE_PROVIDER_TIMEOUT_MS: ${SOURCE_PROVIDER_TIMEOUT_MS:-5000}
      SOURCE_RESOLVE_TIMEOUT_MS: ${SOURCE_RESOLVE_TIMEOUT_MS:-15000}
      SOURCE_PROBE_TIMEOUT_MS: ${SOURCE_PROBE_TIMEOUT_MS:-2500}
      DLHD_URL: http://dlhd:3000
      DLSTREAMS_247: ${DLSTREAMS_247:-https://dlstreams.st/24-7-channels.php}
      DLSTREAMS_HOME: ${DLSTREAMS_HOME:-https://dlstreams.st/}
      STREMIO_UPSTREAM: http://stremio-addon:7000
      LIBRARY_RESOLVER_ROOT: ${LIBRARY_RESOLVER_ROOT:-/mnt/library-resolver}
      PATH_MOVIES_1080: ${PATH_MOVIES_1080:-/mnt/library-resolver/Movies/Movies}
      PATH_MOVIES_4K: ${PATH_MOVIES_4K:-/mnt/library-resolver/Movies/Movies-4K}
      PATH_TV_1080: ${PATH_TV_1080:-/mnt/library-resolver/TV/TV}
      PATH_TV_4K: ${PATH_TV_4K:-/mnt/library-resolver/TV/TV-4K}
      PATH_LIVE: ${PATH_LIVE:-/mnt/resolver-files/Live}
      CATALOG_STATE_DIR: ${CATALOG_STATE_DIR:-/mnt/resolver-files/catalog-state}
      CATALOG_QUARANTINE_ROOT: ${CATALOG_QUARANTINE_ROOT:-/mnt/library-resolver/.quarantine}
      GENERATE_ON_START: ${GENERATE_ON_START:-true}
      MOVIE_PAGES: ${MOVIE_PAGES:-40}
      TV_PAGES: ${TV_PAGES:-25}
      TV_MAX_EPISODES: ${TV_MAX_EPISODES:-24}
      TV_MAX_SEASONS: ${TV_MAX_SEASONS:-4}
      INITIAL_MOVIES_TARGET: ${INITIAL_MOVIES_TARGET:-10000}
      INITIAL_SHOWS_TARGET: ${INITIAL_SHOWS_TARGET:-1500}
      MOVIES_ADD_PER_RUN: ${MOVIES_ADD_PER_RUN:-2000}
      SHOWS_ADD_PER_RUN: ${SHOWS_ADD_PER_RUN:-100}
      MAX_MOVIES: ${MAX_MOVIES:-0}
      MAX_SHOWS: ${MAX_SHOWS:-0}
      DISCOVER_FROM_YEAR: ${DISCOVER_FROM_YEAR:-1900}
      CATALOG_FRESH_PAGES: ${CATALOG_FRESH_PAGES:-3}
      CATALOG_MAX_DISCOVERY_PAGES_PER_RUN: ${CATALOG_MAX_DISCOVERY_PAGES_PER_RUN:-650}
      CATALOG_TMDB_DELAY_MS: ${CATALOG_TMDB_DELAY_MS:-200}
      CATALOG_HEALTH_ENABLED: ${CATALOG_HEALTH_ENABLED:-true}
      CATALOG_HEALTH_INTERVAL_HOURS: ${CATALOG_HEALTH_INTERVAL_HOURS:-24}
      CATALOG_HEALTH_MOVIES_PER_RUN: ${CATALOG_HEALTH_MOVIES_PER_RUN:-2500}
      CATALOG_HEALTH_SHOWS_PER_RUN: ${CATALOG_HEALTH_SHOWS_PER_RUN:-150}
      CATALOG_HEALTH_RETRY_FAILURES_PER_RUN: ${CATALOG_HEALTH_RETRY_FAILURES_PER_RUN:-250}
      CATALOG_HEALTH_QUARANTINED_PER_RUN: ${CATALOG_HEALTH_QUARANTINED_PER_RUN:-50}
      CATALOG_HEALTH_CONCURRENCY: ${CATALOG_HEALTH_CONCURRENCY:-4}
      CATALOG_HEALTH_FAILURE_THRESHOLD: ${CATALOG_HEALTH_FAILURE_THRESHOLD:-3}
      CATALOG_HEALTH_FAILURE_GAP_HOURS: ${CATALOG_HEALTH_FAILURE_GAP_HOURS:-24}
      CATALOG_HEALTH_QUARANTINE_DAYS: ${CATALOG_HEALTH_QUARANTINE_DAYS:-7}
      CATALOG_QUARANTINE_RECHECK_DAYS: ${CATALOG_QUARANTINE_RECHECK_DAYS:-7}
      CATALOG_HEALTH_STRICT: ${CATALOG_HEALTH_STRICT:-false}
      CATALOG_HEALTH_SHOW_SAMPLES: ${CATALOG_HEALTH_SHOW_SAMPLES:-3}
      QUALITY_FALLBACK: ${QUALITY_FALLBACK:-true}
      EPG_URL: ${EPG_URL:-}
      LIVE_REFRESH_MIN: ${LIVE_REFRESH_MIN:-360}
      CATALOG_REFRESH_HOURS: ${CATALOG_REFRESH_HOURS:-24}
      QUALITIES: ${QUALITIES:-1080p,4k}
      RESOLVE_TTL_MS: ${RESOLVE_TTL_MS:-3600000}
      TMDB_API_KEY: ${TMDB_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PLAYLIST_KEY: ${PLAYLIST_KEY:-}
      AUTO_UPDATE_ENABLED: ${AUTO_UPDATE_ENABLED:-true}
      AUTO_UPDATE_INTERVAL_HOURS: ${AUTO_UPDATE_INTERVAL_HOURS:-24}
      AUTO_UPDATE_STARTUP_DELAY_MS: ${AUTO_UPDATE_STARTUP_DELAY_MS:-15000}
      AUTO_UPDATE_GIT_TIMEOUT_MS: ${AUTO_UPDATE_GIT_TIMEOUT_MS:-30000}
      AUTO_UPDATE_BUILD_TIMEOUT_MS: ${AUTO_UPDATE_BUILD_TIMEOUT_MS:-1200000}
      AUTO_UPDATE_UP_TIMEOUT_MS: ${AUTO_UPDATE_UP_TIMEOUT_MS:-120000}
      AUTO_UPDATE_PROJECT_DIR: /workspace
      AUTO_UPDATE_COMPOSE_FILE: /workspace/docker-compose.yml
      AUTO_UPDATE_COMPOSE_ENV_FILE: /workspace/.env
      AUTO_UPDATE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-justone}
      AUTO_UPDATE_STATE_DIR: /var/lib/justone-updater
      CINEPRO_SOURCE_DIR: /workspace/providers/cinepro
      WEBSTREAMR_MBG_SOURCE_DIR: /workspace/providers/webstreamr-mbg
      CINEPRO_COMPOSE_SERVICE: cinepro
      WEBSTREAMR_MBG_COMPOSE_SERVICE: webstreamr-mbg
    volumes:
      # STRM libraries are separated from the Live TV/runtime files.
      - ${LIBRARY_RESOLVER_ROOT:-/mnt/library-resolver}:/mnt/library-resolver
      - ${RESOLVER_FILES:-/mnt/resolver-files}:/mnt/resolver-files
      # The updater needs the Compose project definition plus writable provider checkouts.
      - ./:/workspace:ro
      - ./providers/cinepro:/workspace/providers/cinepro
      - ./providers/webstreamr-mbg:/workspace/providers/webstreamr-mbg
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - provider_update_state:/var/lib/justone-updater
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - cinepro
      - dlhd
    networks:
      - justone
      - media_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=media_net"
      - "traefik.http.routers.justone-platform.rule=Host(`resolver.vpn4u.cc`)"
      - "traefik.http.routers.justone-platform.entrypoints=websecure"
      - "traefik.http.routers.justone-platform.tls=true"
      - "traefik.http.routers.justone-platform.tls.certresolver=le"
      - "traefik.http.routers.justone-platform.priority=10000"
      - "traefik.http.routers.justone-platform.service=justone-platform"
      - "traefik.http.services.justone-platform.loadbalancer.server.port=8080"

  jellyfin-live:
    build:
      context: ./apps/jellyfin-live
    container_name: justone-jellyfin-live
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JELLYFIN_LIVE_PORT: "8090"
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      PLATFORM_URL: http://platform:8080
      PLAYLIST_KEY: ${PLAYLIST_KEY:-}
      DLSTREAMS_HOME: ${DLSTREAMS_HOME:-https://dlstreams.st/}
      EPG_URL: ${EPG_URL:-}
      JELLYFIN_EPG_SOURCE_URLS: ${JELLYFIN_EPG_SOURCE_URLS:-}
      JELLYFIN_AUTO_EPG: ${JELLYFIN_AUTO_EPG:-true}
      JELLYFIN_EPG_MAX_SOURCES: ${JELLYFIN_EPG_MAX_SOURCES:-12}
      JELLYFIN_EPG_CACHE_MIN: ${JELLYFIN_EPG_CACHE_MIN:-60}
      JELLYFIN_REFRESH_MIN: ${JELLYFIN_REFRESH_MIN:-10}
      JELLYFIN_EXCLUDE_ADULT: ${JELLYFIN_EXCLUDE_ADULT:-true}
    depends_on:
      - platform
    networks:
      - justone
      - media_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=media_net"
      - "traefik.http.routers.justone-jellyfin.rule=Host(`resolver.vpn4u.cc`) && PathPrefix(`/jellyfin`)"
      - "traefik.http.routers.justone-jellyfin.entrypoints=websecure"
      - "traefik.http.routers.justone-jellyfin.tls=true"
      - "traefik.http.routers.justone-jellyfin.tls.certresolver=le"
      - "traefik.http.routers.justone-jellyfin.priority=11000"
      - "traefik.http.routers.justone-jellyfin.service=justone-jellyfin"
      - "traefik.http.services.justone-jellyfin.loadbalancer.server.port=8090"

  stremio-addon:
    build:
      context: ./apps/stremio-addon
    container_name: justone-stremio
    restart: unless-stopped
    environment:
      PORT: "7000"
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      PLATFORM_URL: http://platform:8080
      CINEPRO_URL: http://cinepro:3000
      DLHD_URL: http://dlhd:3000
      TMDB_API_KEY: ${TMDB_API_KEY}
    labels:
      - "traefik.enable=false"
    networks:
      - justone

volumes:
  webstreamr_mbg_cache:
  provider_update_state:

networks:
  justone:
    name: justone_internal
  media_net:
    name: ${TRAEFIK_NETWORK:-media_net}
    external: true
