# Traefik on external network media_net. No host ports — Traefik is the only ingress.

services:
  cinepro:
    image: ghcr.io/cinepro-org/core:latest
    container_name: justone-cinepro
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      STREMIO_ADDON: ${STREMIO_ADDON:-true}
      HOST: "0.0.0.0"
      PORT: "3000"
      PUBLIC_URL: ${CINEPRO_PUBLIC_URL:-https://resolver.vpn4u.cc/cinepro}
    networks:
      - justone
      - media_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-media_net}"
      - "traefik.http.routers.justone-cinepro.rule=Host(`${TRAEFIK_HOST:-resolver.vpn4u.cc}`) && PathPrefix(`/cinepro`)"
      - "traefik.http.routers.justone-cinepro.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.justone-cinepro.tls=true"
      - "traefik.http.routers.justone-cinepro.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.routers.justone-cinepro.priority=100"
      - "traefik.http.middlewares.justone-cinepro-strip.stripprefix.prefixes=/cinepro"
      - "traefik.http.routers.justone-cinepro.middlewares=justone-cinepro-strip"
      - "traefik.http.services.justone-cinepro.loadbalancer.server.port=3000"

  dlhd:
    build:
      context: ./docker/dlhd
    image: justone-dlhd:local
    container_name: justone-dlhd
    restart: unless-stopped
    environment:
      PORT: "3000"
      DLHD_BASE: ${DLHD_BASE:-https://dlhd.st}
    networks:
      - justone

  platform:
    build:
      context: ./apps/platform
    container_name: justone-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PLATFORM_PORT: "8080"
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      CINEPRO_URL: http://cinepro:3000
      CINEPRO_PUBLIC_URL: ${CINEPRO_PUBLIC_URL:-https://resolver.vpn4u.cc/cinepro}
      DLHD_URL: http://dlhd:3000
      LIBRARY_ROOT: /data/library
      EPG_URL: ${EPG_URL:-}
      LIVE_REFRESH_MIN: ${LIVE_REFRESH_MIN:-30}
      QUALITIES: ${QUALITIES:-1080p,4k}
      RESOLVE_TTL_MS: ${RESOLVE_TTL_MS:-900000}
      TMDB_API_KEY: ${TMDB_API_KEY}
    volumes:
      - ${LIBRARY_BIND:-./data/library}:/data/library
    depends_on:
      - cinepro
      - dlhd
    networks:
      - justone
      - media_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-media_net}"
      - "traefik.http.routers.justone.rule=Host(`${TRAEFIK_HOST:-resolver.vpn4u.cc}`)"
      - "traefik.http.routers.justone.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.justone.tls=true"
      - "traefik.http.routers.justone.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.routers.justone.priority=1"
      - "traefik.http.services.justone.loadbalancer.server.port=8080"

  stremio-addon:
    build:
      context: ./apps/stremio-addon
    container_name: justone-stremio
    restart: unless-stopped
    environment:
      PORT: "7000"
      PUBLIC_URL: ${PUBLIC_URL:-https://resolver.vpn4u.cc}
      PLATFORM_URL: http://platform:8080
      CINEPRO_URL: http://cinepro:3000
      DLHD_URL: http://dlhd:3000
      TMDB_API_KEY: ${TMDB_API_KEY}
    depends_on:
      - platform
    networks:
      - justone
      - media_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-media_net}"
      - "traefik.http.routers.justone-stremio.rule=Host(`${TRAEFIK_HOST:-resolver.vpn4u.cc}`) && PathPrefix(`/stremio`)"
      - "traefik.http.routers.justone-stremio.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.justone-stremio.tls=true"
      - "traefik.http.routers.justone-stremio.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.routers.justone-stremio.priority=100"
      - "traefik.http.services.justone-stremio.loadbalancer.server.port=7000"

networks:
  justone:
    name: justone
  media_net:
    name: ${TRAEFIK_NETWORK:-media_net}
    external: true
