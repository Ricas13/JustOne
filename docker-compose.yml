services:
  cinepro:
    image: ghcr.io/cinepro-org/core:latest
    container_name: justone-cinepro
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      STREMIO_ADDON: ${STREMIO_ADDON:-true}
      HOST: "0.0.0.0"
      PORT: "3000"
      PUBLIC_URL: ${CINEPRO_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - justone

  dlhd:
    build:
      context: ./docker/dlhd
    image: justone-dlhd:local
    container_name: justone-dlhd
    restart: unless-stopped
    environment:
      PORT: "3000"
      DLHD_BASE: ${DLHD_BASE:-https://dlhd.st}
    ports:
      - "3001:3000"
    networks:
      - justone

  platform:
    build:
      context: ./apps/platform
    container_name: justone-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PLATFORM_PORT: "8080"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      CINEPRO_URL: http://cinepro:3000
      CINEPRO_PUBLIC_URL: ${CINEPRO_PUBLIC_URL:-http://localhost:3000}
      DLHD_URL: http://dlhd:3000
      LIBRARY_ROOT: /data/library
      EPG_URL: ${EPG_URL:-}
      LIVE_REFRESH_MIN: ${LIVE_REFRESH_MIN:-30}
      QUALITIES: ${QUALITIES:-1080p,4k}
      RESOLVE_TTL_MS: ${RESOLVE_TTL_MS:-900000}
      TMDB_API_KEY: ${TMDB_API_KEY}
    volumes:
      - ./data/library:/data/library
    depends_on:
      - cinepro
      - dlhd
    ports:
      - "8080:8080"
    networks:
      - justone

  stremio-addon:
    build:
      context: ./apps/stremio-addon
    container_name: justone-stremio
    restart: unless-stopped
    environment:
      PORT: "7000"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      PLATFORM_URL: ${PUBLIC_URL:-http://localhost:8080}
      CINEPRO_URL: http://cinepro:3000
      DLHD_URL: http://dlhd:3000
      TMDB_API_KEY: ${TMDB_API_KEY}
    depends_on:
      - platform
    ports:
      - "7000:7000"
    networks:
      - justone

networks:
  justone:
    name: justone
