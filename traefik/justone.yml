# Host path: /opt/traefik/dynamic/justone.yml  (Traefik watches this)
# Traefik shares media_net with justone-platform — do not use 127.0.0.1.

http:
  routers:
    justone-platform:
      rule: Host(`resolver.vpn4u.cc`)
      entryPoints:
        - websecure
      service: justone-platform
      priority: 10000
      tls:
        certResolver: le

  services:
    justone-platform:
      loadBalancer:
        servers:
          - url: http://justone-platform:8080
