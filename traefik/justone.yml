# Copy to: /opt/traefik/dynamic/justone.yml
# Repo lives at /opt/JustOne

http:
  routers:
    justone-platform:
      rule: Host(`resolver.vpn4u.cc`)
      entryPoints:
        - websecure
      service: justone-platform
      priority: 10000
      tls:
        certResolver: le

  services:
    justone-platform:
      loadBalancer:
        responseForwarding:
          # Live TV is one indefinitely-open response. Flush chunks promptly so
          # Jellyfin sees tuner media without proxy-side aggregation latency.
          flushInterval: 100ms
        servers:
          - url: http://justone-platform:8080
