# Put this in Traefik's file-provider directory. This host does NOT use Docker
# labels for vpn4u.cc (vpn4u-site is 127.0.0.1:3000) — labels will never win.
#
# If Traefik uses network_mode: host (likely), keep 127.0.0.1:18080.
# If Traefik is on media_net instead, use: http://justone-platform:8080

http:
  routers:
    justone-platform:
      rule: Host(`resolver.vpn4u.cc`)
      entryPoints:
        - websecure
      service: justone-platform
      priority: 10000
      tls: {}

  services:
    justone-platform:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:18080
