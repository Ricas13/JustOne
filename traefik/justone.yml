# Copy onto Traefik's file-provider directory (e.g. /etc/traefik/dynamic/justone.yml)
# then wait a few seconds. No certResolver — reuses the existing resolver.vpn4u.cc cert.

http:
  routers:
    justone-platform:
      rule: Host(`resolver.vpn4u.cc`)
      entryPoints:
        - websecure
      service: justone-platform
      priority: 10000
      tls: {}

  services:
    justone-platform:
      loadBalancer:
        servers:
          - url: http://justone-platform:8080
